services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      LASER_DATA_DIR: /workspace/data
      LASER_EXPERIMENTS_DIR: /workspace/experiments
      LASER_CONFIG_DIR: /workspace/configs
      PROJECT_ROOT: /workspace
      LASER_ADMIN_USERNAME: ${LASER_ADMIN_USERNAME:-}
      LASER_ADMIN_PASSWORD: ${LASER_ADMIN_PASSWORD:-}
      LASER_COOKIE_SECURE: ${LASER_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data:/workspace/data
      - ./experiments:/workspace/experiments
      - ./configs:/workspace/configs:ro
      - ./docs/literature:/workspace/docs/literature:ro
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ""
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.services.agent_model_worker"]
    env_file:
      - .env
    environment:
      LASER_DATA_DIR: /workspace/data
      LASER_EXPERIMENTS_DIR: /workspace/experiments
      LASER_CONFIG_DIR: /workspace/configs
    volumes:
      - ./data:/workspace/data
      - ./experiments:/workspace/experiments
      - ./configs:/workspace/configs:ro
      - ./docs/literature:/workspace/docs/literature:ro
    restart: unless-stopped
